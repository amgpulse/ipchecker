name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Read version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract VERSION from ipchecker.pro
        id: read
        shell: bash
        run: |
          version=$(sed -n 's/^VERSION[[:space:]]*=[[:space:]]*//p' ipchecker.pro | tr -d ' \r')
          if [[ -z "$version" ]]; then
            echo "::error::Could not read VERSION from ipchecker.pro"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building version $version"

  build-linux-deb:
    name: Linux .deb
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6 and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev build-essential dpkg-dev

      - name: Build
        run: |
          qmake6 ipchecker.pro
          make -j"$(nproc)"

      - name: Smoke test (headless)
        run: |
          set +e
          timeout 10s env QT_QPA_PLATFORM=offscreen ./ipchecker
          code=$?
          set -e
          if [ "$code" -ne 124 ]; then
            echo "::error::Smoke test failed: app exited with code $code instead of staying alive"
            exit 1
          fi

      - name: Create .deb package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          strip --strip-unneeded ipchecker
          mkdir -p packaging/deb/usr/bin
          cp ipchecker packaging/deb/usr/bin/ipchecker
          chmod 755 packaging/deb/usr/bin/ipchecker

          sed -i "s/^Version:.*/Version: ${VERSION}/" packaging/deb/DEBIAN/control
          echo "Installed-Size: $(du -ks packaging/deb/usr | cut -f1)" >> packaging/deb/DEBIAN/control
          chmod 755 packaging/deb/DEBIAN/postinst packaging/deb/DEBIAN/postrm

          dpkg-deb --build --root-owner-group packaging/deb "ipchecker_${VERSION}_amd64.deb"
          dpkg-deb --info "ipchecker_${VERSION}_amd64.deb"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: ipchecker_${{ needs.version.outputs.version }}_amd64.deb

  build-linux-rpm:
    name: Linux .rpm
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container: fedora:latest
    steps:
      - name: Install build tools
        run: |
          dnf install -y git qt6-qtbase-devel gcc-c++ make rpm-build tar gzip desktop-file-utils

      - uses: actions/checkout@v4

      - name: Build .rpm package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git config --global --add safe.directory "$PWD"
          set -euo pipefail
          sed -i "s/^Version:.*/Version: ${VERSION}/" ipchecker.spec

          mkdir -p "$HOME"/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          git archive --format=tar.gz \
            --prefix="ipchecker-${VERSION}/" \
            -o "$HOME/rpmbuild/SOURCES/ipchecker-${VERSION}.tar.gz" HEAD

          rpmbuild -ba ipchecker.spec \
            --define "_sourcedir $HOME/rpmbuild/SOURCES" \
            --define "_builddir $HOME/rpmbuild/BUILD" \
            --define "_rpmdir $HOME/rpmbuild/RPMS" \
            --define "_specdir $HOME/rpmbuild/SPECS" \
            --define "_srcrpmdir $HOME/rpmbuild/SRPMS"

          find "$HOME/rpmbuild/RPMS" -name '*.rpm' -exec cp {} . \;
          ls -la ./*.rpm
          rpm -qip ./*.rpm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-rpm
          path: ./*.rpm

  build-windows:
    name: Windows .zip + installer
    needs: version
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          cache: true

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build
        id: build
        shell: cmd
        run: |
          qmake ipchecker.pro CONFIG+=release
          nmake release || nmake
          if not exist release\ipchecker.exe (
            echo "::error::release/ipchecker.exe was not produced"
            exit /b 1
          )
          echo Built release/ipchecker.exe

      - name: Deploy Qt runtime
        shell: bash
        run: |
          set -euo pipefail
          WINDEPLOYQT="$(command -v windeployqt || command -v windeployqt6)"
          "$WINDEPLOYQT" --release --compiler-runtime --no-translations release/ipchecker.exe
          ls -la release/

      - name: Package portable zip
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          7z a "ipchecker_${VERSION}_windows_x64.zip" ./release/*

      - name: Build installer (Inno Setup)
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          sed -i "s/^#define MyAppVersion .*/#define MyAppVersion \"${VERSION}\"/" packaging/windows/ipinstaller.iss
          if command -v iscc >/dev/null 2>&1; then
            ISCC="iscc"
          else
            ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          fi
          "$ISCC" packaging/windows/ipinstaller.iss
          ls -la packaging/windows/*.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            ipchecker_${{ needs.version.outputs.version }}_windows_x64.zip
            packaging/windows/ipchecker_${{ needs.version.outputs.version }}_setup.exe

  build-macos:
    name: macOS .zip + .dmg
    needs: version
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.0'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          cache: true

      - name: Build
        run: |
          qmake ipchecker.pro
          make -j"$(sysctl -n hw.ncpu)"

      - name: Deploy Qt runtime into app bundle
        run: macdeployqt ipchecker.app -always-overwrite

      - name: Package .zip and .dmg
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          ditto -c -k --keepParent ipchecker.app "ipchecker_${VERSION}_macos.zip"

          STAGE="$(mktemp -d)"
          cp -R ipchecker.app "$STAGE/"
          hdiutil create -volname "IP Inspector Pro" -srcfolder "$STAGE" -ov \
            -format UDZO "ipchecker_${VERSION}_macos.dmg"
          ls -la "ipchecker_${VERSION}_macos.zip" "ipchecker_${VERSION}_macos.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            ipchecker_${{ needs.version.outputs.version }}_macos.zip
            ipchecker_${{ needs.version.outputs.version }}_macos.dmg

  release:
    name: Create GitHub Release
    needs: [version, build-linux-deb, build-linux-rpm, build-windows, build-macos]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail

          mapfile -t assets < <(find artifacts -type f | sort)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::No release assets found"
            exit 1
          fi
          printf 'Asset: %s\n' "${assets[@]}"

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
            TITLE="$TAG"
            CREATE_ARGS=(--title "$TAG" --generate-notes)
          else
            TAG="continuous"
            TITLE="Continuous Build (${GITHUB_REF_NAME})"
            CREATE_ARGS=(
              --title "$TITLE"
              --notes "Automatic build of ${GITHUB_SHA:0:7} on ${GITHUB_REF_NAME} (version ${VERSION})."
              --prerelease
              --latest=false
            )
          fi

          if [ "$TAG" = "continuous" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -f "$TAG" "$GITHUB_SHA"
            git push --force origin "refs/tags/$TAG"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE"
          else
            gh release create "$TAG" "${CREATE_ARGS[@]}"
          fi

          gh release upload "$TAG" "${assets[@]}" --clobber